<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>9 เดือนของเรา</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap">
<style>
  /* Layout: one centered card per step, full-height sky-blue stage; a single committed look (no dark theme) */
  :root {
    --bg: #e0f1ff;
    --bg2: #bfe0ff;
    --card: #f6fbff;
    --fg: #163a5e;
    --muted: #5a7fa3;
    --accent: #3b8fe8;
    --accent-dark: #1f6fc9;
    --no: #9fb3c8;
    --font: "Mali", "Kanit", "Sarabun", "Noto Sans Thai", system-ui, sans-serif;
    color-scheme: light;
  }
  [hidden] { display: none !important; }
  img { max-width: 100%; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--font);
    color: var(--fg);
    background: radial-gradient(circle at 20% 10%, #f2f9ff 0, var(--bg) 40%, var(--bg2) 100%);
    display: grid;
    place-items: center;
    padding-inline: 16px;
    padding-block: 24px;
    box-sizing: border-box;
    overflow-x: hidden;
  }
  .card {
    background: var(--card);
    border-radius: 28px;
    box-shadow: 0 18px 50px rgba(31, 111, 201, .18);
    padding: 28px 22px;
    width: min(100%, 420px);
    text-align: center;
    display: grid;
    gap: 18px;
    justify-items: center;
    animation: pop .45s cubic-bezier(.2,.9,.3,1.2);
  }
  @keyframes pop { from { transform: scale(.85); opacity: 0 } to { transform: scale(1); opacity: 1 } }
  .gif {
    width: min(100%, 300px);
    border-radius: 18px;
    display: block;
    background: #e6f2ff;
    min-height: 120px;
  }
  h1 { font-size: 1.7rem; margin: 0; line-height: 1.3; text-wrap: balance; font-weight: 700; }
  p  { margin: 0; font-size: 1.15rem; line-height: 1.55; }
  .small { color: var(--muted); font-size: .95rem; }
  button {
    font: inherit;
    font-weight: 700;
    font-size: 1.15rem;
    border: 0;
    border-radius: 999px;
    padding: 14px 26px;
    cursor: pointer;
    color: #fff;
    background: var(--accent);
    box-shadow: 0 8px 20px rgba(59, 143, 232, .35);
    transition: transform .15s;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  button:hover, button:focus-visible { transform: scale(1.05); outline: 3px solid #a9d1ff; outline-offset: 2px; }
  button:active { transform: scale(.97); }
  .yes { animation: beat 1.4s ease-in-out infinite; }
  @keyframes beat { 0%,100% { transform: scale(1) } 50% { transform: scale(1.08) } }
  .no { background: var(--no); box-shadow: 0 8px 20px rgba(0,0,0,.12); }
  .no.fly { position: fixed; z-index: 10; transition: left .25s, top .25s; margin: 0; }
  .choices { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
  .hearts { font-size: 1.6rem; letter-spacing: .2em; }
  .final h1 { font-size: 2rem; color: var(--accent-dark); }
  .msg {
    font-size: 1.25rem;
    line-height: 1.7;
    background: #e8f3ff;
    border-radius: 18px;
    padding: 16px 18px;
  }
  /* iPad / iPad Air (768px and up): bigger card, type and GIFs */
  @media (min-width: 700px) {
    .card { width: min(100%, 640px); padding: 44px 40px; gap: 26px; border-radius: 36px; }
    .gif { width: min(100%, 440px); border-radius: 24px; }
    h1 { font-size: 2.6rem; }
    .final h1 { font-size: 3rem; }
    p, .msg { font-size: 1.6rem; }
    button { font-size: 1.6rem; padding: 18px 36px; }
    .hearts { font-size: 2.4rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card, .yes { animation: none; }
    .no.fly { transition: none; }
  }
</style>
</head>
<body>

<section class="card" id="step1">
  <img class="gif" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExZ2Y0d3E2c2JxM2FrM2FrNTNjMDU1OG1zaXRpMzhvaGd0NmdkdjluZSZlcD12MV9naWZzX3NlYXJjaCZjdD1n/gdwf3hCno7Uouwdjmf/giphy.gif" alt="">
  <h1>หวัดดีก๊าบบบที่รักกก</h1>
  <button id="next1">💙</button>
</section>

<section class="card" id="step2" hidden>
  <img class="gif" id="askGif" src="https://media.giphy.com/media/v1.Y2lkPWVjZjA1ZTQ3dTQwNzhmN2diaGpybm9yNjBxMWFsdmFoOXFoYmJkdGltY2szc2ZoMCZlcD12MV9naWZzX3NlYXJjaCZjdD1n/piTZCzZKam8JXpTjZ1/giphy.gif" alt="">
  <h1>รักเค้าาม้ายยยย</h1>
  <img class="gif" id="noGif" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExZ2Y0d3E2c2JxM2FrM2FrNTNjMDU1OG1zaXRpMzhvaGd0NmdkdjluZSZlcD12MV9naWZzX3NlYXJjaCZjdD1n/CuM49YKw7hQdZICrn9/giphy.gif" alt="" hidden>
  <div class="choices">
    <button class="yes" id="yesBtn">รักกม้ากกกกก</button>
    <button class="no" id="noBtn">ม่ายยรักกเยยย เชอะะะะ!!!</button>
  </div>
</section>

<section class="card final" id="step3" hidden>
  <img class="gif" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExZ2Y0d3E2c2JxM2FrM2FrNTNjMDU1OG1zaXRpMzhvaGd0NmdkdjluZSZlcD12MV9naWZzX3NlYXJjaCZjdD1n/xT39CQIcoWQXQ5peco/giphy.gif" alt="">
  <h1>Happy 9 months anniversary</h1>
  <p class="msg">ครบรอบ 9 เดือนแย้วน้าาาขอให้สุขภาพร่างกายแข็งแรงอยู่กับเค้าาปายยนานนๆๆน้าาา</p>
  <div class="hearts">💙💙💙</div>
</section>

<script>
(function () {
  var step1 = document.getElementById('step1');
  var step2 = document.getElementById('step2');
  var step3 = document.getElementById('step3');
  var noBtn = document.getElementById('noBtn');
  var yesBtn = document.getElementById('yesBtn');
  var noGif = document.getElementById('noGif');
  var dodges = 0, MAX = 10, lastRun = 0;

  document.getElementById('next1').addEventListener('click', function () {
    step1.hidden = true; step2.hidden = false;
  });

  yesBtn.addEventListener('click', function () {
    step2.hidden = true; step3.hidden = false;
    if (noBtn.classList.contains('fly')) noBtn.hidden = true;
  });

  function runAway() {
    if (noBtn.hidden) return;
    var now = Date.now();
    if (now - lastRun < 350) return;
    lastRun = now;
    dodges++;
    if (dodges >= MAX) {
      noBtn.hidden = true;
      noGif.hidden = false;
      document.getElementById('askGif').hidden = true;
      return;
    }
    noBtn.classList.add('fly');
    var w = noBtn.offsetWidth, h = noBtn.offsetHeight;
    var vw = window.innerWidth, vh = window.innerHeight;
    var pad = 12;
    var yr = yesBtn.getBoundingClientRect();
    var x, y, tries = 0;
    do {
      x = pad + Math.random() * Math.max(1, vw - w - pad * 2);
      y = pad + Math.random() * Math.max(1, vh - h - pad * 2);
      tries++;
    } while (tries < 20 && !(x + w < yr.left - 20 || x > yr.right + 20 || y + h < yr.top - 20 || y > yr.bottom + 20));
    noBtn.style.left = x + 'px';
    noBtn.style.top = y + 'px';
  }

  noBtn.addEventListener('mouseenter', runAway);
  noBtn.addEventListener('touchstart', function (e) { e.preventDefault(); runAway(); }, { passive: false });
  noBtn.addEventListener('pointerdown', function (e) { if (e.pointerType !== 'mouse') { e.preventDefault(); } });
  noBtn.addEventListener('click', function (e) { e.preventDefault(); runAway(); });
  noBtn.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); runAway(); } });
})();
</script>
</body>
</html>
